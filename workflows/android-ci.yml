name: Android CI

# Build, Android Lint, unit tests + coverage gate, screenshot validation and static analysis
# for projects scaffolded with ARCDevTools-Android (arc.* convention plugins).

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, Lint, Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 17 is the bytecode target; JDK 21 runs the Gradle daemon
      # (gradle/gradle-daemon-jvm.properties). The last version listed is the default.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Setup Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      # assemble + lint (warningsAsErrors) + unit tests + JaCoCo >= 80% + detekt + ktlint
      - name: Build
        run: ./gradlew build

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  screenshot-tests:
    name: Screenshot Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Setup Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      # Compares @PreviewTest renders with the reference images committed in
      # <module>/src/screenshotTestDebug/reference (create them with updateDebugScreenshotTest).
      - name: Validate screenshots
        run: ./gradlew validateDebugScreenshotTest

      - name: Upload screenshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: '**/build/reports/screenshotTest/'
          retention-days: 7

  static-analysis:
    name: detekt + ktlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Setup Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run detekt and ktlint
        run: ./gradlew detekt ktlintCheck

      - name: Generate summary
        if: always()
        run: |
          echo "## Static Analysis" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" == 'success' ]; then
            echo "detekt and ktlint passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Violations found. Run \`./gradlew ktlintFormat\` and fix the detekt findings." >> "$GITHUB_STEP_SUMMARY"
          fi
