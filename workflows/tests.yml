name: Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Android variant for the unit-test task (test<Variant>UnitTest). Flavored projects set
  # flavor + build type, e.g. DevDebug. `arc-setup --variant <Name>` writes it here.
  ARC_VARIANT: Debug

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test${{ env.ARC_VARIANT }}UnitTest --daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Generate test summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "All unit tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some tests failed. See artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
          fi
