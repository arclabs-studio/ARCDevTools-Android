name: Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Android variant for the unit-test task (test<Variant>UnitTest). Flavored projects set
  # flavor + build type, e.g. DevDebug. `arc-setup --variant <Name>` writes it here.
  ARC_VARIANT: Debug

  # Firebase Local Emulator Suite for tests that talk to Firebase (opt-in). A comma-separated
  # list of emulators (e.g. auth,firestore) wraps the Gradle steps in `firebase emulators:exec`
  # against ARC_FIREBASE_PROJECT (a demo-* id: never touches a real project). Empty = off.
  # `arc-setup --firebase-emulators <list> --firebase-project <id>` writes both.
  ARC_FIREBASE_EMULATORS: ""
  ARC_FIREBASE_PROJECT: demo-project

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # JDK 17 is the bytecode target; JDK 21 runs the Gradle daemon
      # (gradle/gradle-daemon-jvm.properties) and the Firebase CLI. The last version listed is the default.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Only with ARC_FIREBASE_EMULATORS: the Firebase CLI runs the emulators (needs JDK 21).
      - name: Set up Node.js (Firebase CLI)
        if: env.ARC_FIREBASE_EMULATORS != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Firebase CLI
        if: env.ARC_FIREBASE_EMULATORS != ''
        run: npm install --global firebase-tools@15.17.0

      - name: Run unit tests
        run: |
          if [ -n "$ARC_FIREBASE_EMULATORS" ]; then
            firebase emulators:exec --only "$ARC_FIREBASE_EMULATORS" --project "$ARC_FIREBASE_PROJECT" "./gradlew test${ARC_VARIANT}UnitTest --daemon"
          else
            ./gradlew test${ARC_VARIANT}UnitTest --daemon
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Generate test summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "All unit tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some tests failed. See artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
          fi
