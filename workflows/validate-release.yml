name: Validate Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.extract.outputs.tag }}
      version: ${{ steps.extract.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag info
        id: extract
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"
          echo "Version: $VERSION"

      # Tag-derived values reach the shell through env, never through ${{ }} inside run:,
      # so a crafted tag name cannot inject commands (the format check below runs on the
      # same value, but only after it is already safely in a variable).
      - name: Validate tag format
        env:
          TAG: ${{ steps.extract.outputs.tag }}
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG"
            echo "Expected format: vX.Y.Z (semantic versioning)"
            exit 1
          fi

          echo "Tag format is valid"

      - name: Check CHANGELOG entry
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "Warning: No CHANGELOG entry found for version $VERSION"
            echo "Please add release notes to CHANGELOG.md"
          else
            echo "CHANGELOG entry found for $VERSION"
          fi

      - name: Verify tag is on main branch
        env:
          TAG: ${{ steps.extract.outputs.tag }}
        run: |
          # Check if tag is reachable from main
          if ! git branch -r --contains "$TAG" | grep -q 'origin/main'; then
            echo "Warning: Tag $TAG is not on main branch"
            echo "Releases should be tagged from main branch"
          else
            echo "Tag is on main branch"
          fi

      - name: Generate validation summary
        if: always()
        env:
          TAG: ${{ steps.extract.outputs.tag }}
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          echo "## Release Tag Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All validation checks completed. See job logs for details." >> $GITHUB_STEP_SUMMARY

  create-release:
    name: Create GitHub Release
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # VERSION was validated as X.Y.Z by the validate-tag job; it still enters the shell via env.
      - name: Extract release notes
        id: notes
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          # Extract changelog section for this version
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            # Get content between this version and next version header
            NOTES=$(awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '1d;$d')
            echo "Found release notes in CHANGELOG.md"
          else
            NOTES="See CHANGELOG.md for details."
            echo "Using default release notes"
          fi

          # Save to file for use in release
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: Release ${{ needs.validate-tag.outputs.tag }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release summary
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GitHub Release created successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> $GITHUB_STEP_SUMMARY
