# ARCDevTools-Android — gradle.properties template
# Version: 0.5.2
#
# Installed by arc-setup only when the project has no gradle.properties yet.

# --- Gradle ---
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- ARC quality gates ---
# Minimum JaCoCo line coverage enforced by `check` (read by the arc.* convention plugins).
# ARC rule: 0.80 for every module inside an app repo; 1.00 for extracted ARC*-Android packages.
arc.coverage.minimum=0.80

# --- Kotlin ---
kotlin.code.style=official

# --- Android ---
android.useAndroidX=true
# Each library's R class only contains its own resources.
android.nonTransitiveRClass=true
# Required by Compose Preview Screenshot Testing (com.android.compose.screenshot, the setup
# documented for AGP < 9.5.0-alpha03).
android.experimental.enableScreenshotTest=true
# AGP prints a warning on every build for the experimental option above, which is opted into
# knowingly. This AGP-provided switch silences only that "experimental option" notice.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
