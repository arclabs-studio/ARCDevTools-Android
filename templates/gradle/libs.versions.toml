# ARCDevTools-Android — Version Catalog Template
# Version: 0.4.0
#
# Copied to gradle/libs.versions.toml by arc-setup. Single source of truth for every
# dependency and plugin version in an ARC Labs Android project — module build files never
# declare literal coordinates. Every coordinate below was verified on Google Maven, Maven
# Central or the Gradle Plugin Portal on 2026-10-21.
#
# Toolchain: Gradle 9.8.2 (wrapper) · JDK 21 to run Gradle · bytecode / jvmTarget 17.

[versions]
# Build
agp = "9.4.0"
kotlin = "2.4.21"
ksp = "2.3.12"

# Android SDK levels (read by the arc.* convention plugins)
# compileSdk 37 is required by the libraries below: Compose 1.12 (BOM 2026.09.00), material3
# 1.5.0-beta01, Navigation 3 1.2.0, Lifecycle 2.11.0 and core 1.19.1 declare minCompileSdk 37
# in their AAR metadata. targetSdk stays at 36 (Google Play requirement from 2026-08-31).
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

# AndroidX core
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"

# UI
composeBom = "2026.09.00"
material3 = "1.5.0-beta01"
material3Adaptive = "1.3.0"
navigation3 = "1.2.0"
coil = "3.6.3"

# DI
hilt = "2.60.1"

# Data
room3 = "3.0.3"
datastore = "1.2.1"
kotlinxSerialization = "1.12.0"
kotlinxCoroutines = "1.11.0"

# Firebase (versions of individual artifacts come from the BoM)
firebaseBom = "35.0.2"
googleServices = "4.5.0"

# Identity
credentials = "1.6.0"
googleid = "1.2.1"

# Payments
revenuecat = "10.28.1"

# Maps
mapsCompose = "9.0.1"

# Testing
junit5 = "5.14.4"
junit4 = "4.13.2"
androidJunit5 = "2.0.2"
turbine = "1.2.1"
robolectric = "4.17"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExt = "1.3.0"
espresso = "3.7.0"
composeScreenshot = "0.0.1-alpha16"

# Quality
detekt = "1.23.8"
# 0.4.x is the last compose-rules line built against detekt 1.23.x (0.5+ targets detekt 2.0 alphas).
composeRulesDetekt = "0.4.28"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"

[libraries]
# --- AndroidX core ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }

# --- Compose ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# Pinned above the BoM (BoM 2026.09.00 ships material3 1.4.0) to get M3 Expressive.
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
androidx-compose-material3-adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3", version.ref = "material3Adaptive" }

# --- Navigation 3 ---
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# --- Images ---
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# --- DI ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# --- Data ---
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-room3-testing = { module = "androidx.room3:room3-testing", version.ref = "room3" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# --- Firebase (BoM-managed) ---
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-functions = { module = "com.google.firebase:firebase-functions" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }
firebase-ai = { module = "com.google.firebase:firebase-ai" }

# --- Identity ---
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

# --- Payments ---
revenuecat-purchases = { module = "com.revenuecat.purchases:purchases", version.ref = "revenuecat" }
revenuecat-purchases-ui = { module = "com.revenuecat.purchases:purchases-ui", version.ref = "revenuecat" }

# --- Maps ---
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }

# --- Testing ---
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
compose-screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "composeScreenshot" }

# --- Quality ---
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRulesDetekt" }

# --- build-logic (compileOnly classpath of the convention plugins) ---
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room3-gradlePlugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "room3" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }
android-junit5-gradlePlugin = { module = "de.mannodermaus.gradle.plugins:android-junit5", version.ref = "androidJunit5" }

[plugins]
# Third-party / platform plugins
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room3 = { id = "androidx.room3", version.ref = "room3" }
android-junit5 = { id = "de.mannodermaus.android-junit", version.ref = "androidJunit5" }
compose-screenshot = { id = "com.android.compose.screenshot", version.ref = "composeScreenshot" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }

# ARC convention plugins (templates/build-logic)
arc-android-application = { id = "arc.android.application" }
arc-android-library = { id = "arc.android.library" }
arc-android-feature = { id = "arc.android.feature" }
arc-android-compose = { id = "arc.android.compose" }
arc-android-hilt = { id = "arc.android.hilt" }
arc-android-room = { id = "arc.android.room" }
arc-android-lint = { id = "arc.android.lint" }
arc-jvm-library = { id = "arc.jvm.library" }
